[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avellaneda-stoikov"
version = "0.1.0"
description = "A from-scratch research implementation of the Avellaneda-Stoikov market making model."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jayden Tan" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
